name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions — this workflow only reads the repo and runs checks.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Production build needs the NEXT_PUBLIC_* vars at build time. Values
      # are hardcoded placeholders so the SDK constructor doesn't throw
      # during static analysis. None come from untrusted PR inputs.
      - name: Build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://demo.medusanextjsstarter.com
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
          NEXT_PUBLIC_DEFAULT_REGION: us
          NEXT_PUBLIC_BASE_URL: https://demo.medusanextjsstarter.com
        run: npm run build
